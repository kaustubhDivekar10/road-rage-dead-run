<script>
/*
 * input.js — the ONLY place keys are read (AGENTS.md Rule 5).
 *
 * Six keys only: Up, Down, Left, Right arrows, Z (either case), Space.
 * - Input.held.<name>    : true while the key is physically down (read every frame, no key-repeat needed)
 * - Input.pressed.<name> : true for exactly ONE poll() after a FRESH press (release + press again)
 * - Held keys are cleared on window blur / tab hide.
 * Everything else (other keys, modified shortcuts, mouse, touch, gamepad) is ignored.
 */
(function (global) {
  'use strict';

  var NAMES = ['up', 'down', 'left', 'right', 'z', 'space'];
  var held = {};
  var queue = {};
  var pressed = {};
  NAMES.forEach(function (n) { held[n] = false; queue[n] = false; pressed[n] = false; });

  function actionFor(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return null; // leave browser shortcuts alone
    if (e.key === 'z' || e.key === 'Z') return 'z';       // Caps Lock on or off
    switch (e.code) {
      case 'ArrowUp': return 'up';
      case 'ArrowDown': return 'down';
      case 'ArrowLeft': return 'left';
      case 'ArrowRight': return 'right';
      case 'Space': return 'space';
      default: return null;
    }
  }

  function clearAll() {
    NAMES.forEach(function (n) { held[n] = false; queue[n] = false; pressed[n] = false; });
  }

  global.addEventListener('keydown', function (e) {
    var a = actionFor(e);
    if (!a) return;
    e.preventDefault(); // stops Space / arrows scrolling the page
    if (global.Sfx && global.Sfx.unlock) global.Sfx.unlock();
    if (!held[a]) {
      held[a] = true;
      // A repeat event with no matching down state (e.g. key was held across a focus change)
      // marks the key as held but is NOT a fresh press.
      if (!e.repeat) queue[a] = true;
    }
  });

  global.addEventListener('keyup', function (e) {
    var a = actionFor(e);
    if (!a) return;
    e.preventDefault();
    held[a] = false;
  });

  global.addEventListener('blur', clearAll);
  if (global.document && global.document.addEventListener) {
    global.document.addEventListener('visibilitychange', function () {
      if (global.document.hidden) clearAll();
    });
  }

  global.Input = {
    held: held,
    pressed: pressed,
    // Call once at the start of every frame.
    poll: function () {
      NAMES.forEach(function (n) { pressed[n] = queue[n]; queue[n] = false; });
    },
    // Drop pending fresh presses (used on every screen change so a press can never carry over).
    flush: function () {
      NAMES.forEach(function (n) { queue[n] = false; pressed[n] = false; });
    },
    // -1 left, +1 right, 0 if neither or both (opposite keys cancel).
    axisX: function () { return (held.right ? 1 : 0) - (held.left ? 1 : 0); },
    anyArrow: function () { return held.up || held.down || held.left || held.right; },
    // Gesture controls use the same input path as keyboard controls.
    inject: function (name, down) {
      if (NAMES.indexOf(name) < 0) return;
      if (down && !held[name]) queue[name] = true;
      held[name] = !!down;
    },
    clearAll: clearAll
  };
})(window);

</script>
<script>
/*
 * audio.js — tiny procedural sound effects (Web Audio). Optional: the game works without it.
 * No audio files, no network. Started on the first allowed key press (browser autoplay rules).
 */
(function (global) {
  'use strict';

  var ctx = null, master = null, engOsc = null, engGain = null, engFilter = null, noiseBuf = null;

  function unlock() {
    try {
      if (!ctx) {
        var AC = global.AudioContext || global.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.5;
        master.connect(ctx.destination);
        var len = ctx.sampleRate;
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        engOsc = ctx.createOscillator();
        engOsc.type = 'sawtooth';
        engOsc.frequency.value = 50;
        engFilter = ctx.createBiquadFilter();
        engFilter.type = 'lowpass';
        engFilter.frequency.value = 260;
        engGain = ctx.createGain();
        engGain.gain.value = 0;
        engOsc.connect(engFilter); engFilter.connect(engGain); engGain.connect(master);
        engOsc.start();
      }
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { ctx = null; }
  }

  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!ctx) return;
    try {
      var t0 = ctx.currentTime + (delay || 0);
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { /* audio is optional */ }
  }

  function noise(dur, vol, freq, delay) {
    if (!ctx || !noiseBuf) return;
    try {
      var t0 = ctx.currentTime + (delay || 0);
      var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf;
      f.type = 'lowpass'; f.frequency.value = freq || 1200;
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t0); s.stop(t0 + dur + 0.02);
    } catch (e) { /* audio is optional */ }
  }

  global.Sfx = {
    unlock: unlock,
    // level 0..1 from speed; on=false silences the engine (title, game over)
    engine: function (level, on) {
      if (!ctx || !engOsc) return;
      try {
        var t = ctx.currentTime;
        engOsc.frequency.setTargetAtTime(48 + level * 95, t, 0.08);
        engFilter.frequency.setTargetAtTime(200 + level * 500, t, 0.08);
        engGain.gain.setTargetAtTime(on ? 0.05 + 0.05 * level : 0, t, 0.1);
      } catch (e) { /* ignore */ }
    },
    start: function () { tone(220, 0.12, 'square', 0.12); tone(330, 0.12, 'square', 0.12, 0, 0.1); tone(440, 0.2, 'square', 0.12, 0, 0.2); },
    crush: function () { noise(0.18, 0.5, 700); tone(120, 0.15, 'sine', 0.35, 50); },
    crash: function () { noise(0.4, 0.7, 1500); tone(90, 0.35, 'square', 0.25, 40); },
    warn: function () { tone(880, 0.09, 'square', 0.12); tone(660, 0.09, 'square', 0.12, 0, 0.12); },
    pulse: function () { tone(180, 0.5, 'sine', 0.35, 900); noise(0.4, 0.15, 3000); },
    boom: function () { noise(1.1, 0.9, 900); tone(70, 0.9, 'sawtooth', 0.35, 28); },
    thunder: function () { noise(1.8, 0.22, 240); noise(1.1, 0.12, 520, 0.16); tone(42, 1.1, 'sine', 0.12, 0.08); },
    win: function () { tone(392, 0.18, 'triangle', 0.3); tone(523, 0.18, 'triangle', 0.3, 0, 0.16); tone(659, 0.18, 'triangle', 0.3, 0, 0.32); tone(784, 0.4, 'triangle', 0.3, 0, 0.48); }
  };
})(window);

</script>

  function rand(a, b) { return a + Math.random() * (b - a); }
  function irand(a, b) { return Math.floor(rand(a, b + 1)); }
  function wrap(v, m) { return ((v % m) + m) % m; }
  function num(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : (d || 0); }
  function laneX(l) { return ROAD_L + LANE_W * (l + 0.5); }
  function fmtScore(s) { return String(Math.floor(num(s))).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function fmtTime(s) { s = Math.max(0, Math.floor(num(s))); var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
  function diff() { return clamp(playTime / ESCAPE_TIME, 0, 1); }

  function rrect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function txt(str, x, y, size, color, align, stroke) {
    ctx.font = 'bold ' + size + 'px ' + FONT;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round';
    ctx.lineWidth = stroke === undefined ? Math.max(4, size / 9) : stroke;
    if (ctx.lineWidth > 0) { ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(str, x, y); }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  // ---------------------------------------------------------------- state
  var state = 'title';     // title | playing | dying | gameover
  var overKind = 'caught'; // caught | escaped
  var clock = 0;           // real-time clock for animations
  var ts = 1;              // world time scale (1 = driving, IDLE_SCALE = no arrow held)
  var scroll = 0;          // total scrolled distance (visual)
  var player, pursuer, zombies, obstacles, decor, particles, floaters, rings;
  var gap, score, playTime, streak, kills, cleanTime, pulseCd, shake, flash;
  var nextRowDist, decorDist, warnLevel, warnTimer, hintT, dyingT, overT, newBest, best, lastSdt;
  var speedLines = [], blotches = [], speckles = [], bloodDecals = [], detachedParts = [], bullets = [];
  var idleDemoSpeed = 250;
  var lightningTimer = 3.5, lightningFlash = 0, lightningSeed = 0;
  var rainDrops = [];
  for (var rainI = 0; rainI < 190; rainI++) rainDrops.push({ x: rand(0, W), y: rand(0, H), len: rand(10, 24), speed: rand(520, 900), drift: rand(-150, -70) });

  try { best = parseInt(window.localStorage.getItem('rrdr_best'), 10) || 0; } catch (e) { best = 0; }
  function saveBest() { try { window.localStorage.setItem('rrdr_best', String(best)); } catch (e) { /* offline-only; ignore */ } }

  (function initScenery() {
    var i;
    for (i = 0; i < 46; i++) {
      var left = Math.random() < 0.5;
      blotches.push({
        x: left ? rand(0, 310) : rand(970, W), y: rand(0, H), rx: rand(20, 90), ry: rand(14, 60),
        c: 'rgba(' + irand(8, 30) + ',' + irand(6, 22) + ',' + irand(4, 16) + ',0.55)'
      });
    }
    for (i = 0; i < 150; i++) {
      var l2 = Math.random() < 0.5;
      speckles.push({ x: l2 ? rand(ROAD_L - 58, ROAD_L - 2) : rand(ROAD_R + 2, ROAD_R + 58), y: rand(0, H), s: rand(1.5, 4), c: Math.random() < 0.5 ? '#4a433b' : '#1f1a16' });
    }
    for (i = 0; i < 26; i++) speedLines.push({ x: rand(ROAD_L - 120, ROAD_R + 120), y: rand(0, H), len: rand(60, 160), v: rand(0.8, 1.4) });
  })();

  function newRun() {
    player = { x: ROAD_CX, vx: 0, speed: 220, inv: 0, flash: 0, wrecked: false, scrape: 0, lastSteer: 0, driftT: 0, driftDir: 0 };
    pursuer = { x: ROAD_CX, stun: 0 };
    zombies = []; obstacles = []; particles = []; floaters = []; rings = []; bloodDecals = []; detachedParts = []; bullets = [];
    gap = GAP_START; ts = 1; lastSdt = 0;
    score = 0; playTime = 0; streak = 0; kills = 0; cleanTime = 0; pulseCd = 0; shake = 0; flash = 0;
    nextRowDist = 700; warnLevel = 0; warnTimer = 0; hintT = 0; dyingT = 0; overT = 0; newBest = false;
  }

  // ---------------------------------------------------------------- spawning
  function pushZombie(x, y, walker) {
    var dirToRoad = x < ROAD_CX ? 1 : -1;
    var skins = ['#8bd63c', '#b6c94a', '#6fbf73', '#9bb0a1', '#c0a45d', '#7eaaa8', '#b7a0a0'];
    var shirts = ['#4b5a3e', '#5a3d62', '#8b3e32', '#344f70', '#77713a', '#5a5a5a', '#754f36', '#2f6559'];
    var limbs = ['#6b8f3a', '#8d9f45', '#5c9a72', '#8f7777', '#a38b4c', '#648c8a'];
    zombies.push({
      x: x, y: y, vx: walker ? dirToRoad * rand(30, 50) : 0, phase: rand(0, 6.28), r: 22,
      skin: skins[irand(0, skins.length - 1)], shirt: shirts[irand(0, shirts.length - 1)], limb: limbs[irand(0, limbs.length - 1)],
      hit: false, t: 0, fx: 0, fy: 0, rot: 0, spin: 0, walker: walker, sway: rand(8, 16)
    });
  }

  function spawnZombieGroup(y, d) {
    var n = 1 + (Math.random() < 0.4 + 0.4 * d ? 1 : 0) + (Math.random() < 0.18 + 0.32 * d ? 1 : 0);
    // Increased group size and extra-spawn odds for a denser infected highway.
    if (Math.random() < 0.4) n++; 
    var xs = [], tries = 0;
    while (xs.length < n && tries < 20) {
      tries++;
      var x = rand(ROAD_L + 34, ROAD_R - 34), ok = true;
      for (var i = 0; i < xs.length; i++) if (Math.abs(xs[i] - x) < 56) ok = false;
      if (ok) xs.push(x);
    }
    xs.forEach(function (x) { pushZombie(x, y + rand(-60, 60), false); });
  }

  function spawnShoulderZombie(y) {
    var left = Math.random() < 0.5;
    pushZombie(left ? rand(ROAD_L - 52, ROAD_L - 22) : rand(ROAD_R + 22, ROAD_R + 52), y, true);
  }

  function pushObstacle(kind, x, y) {
    var o = { type: kind, x: x, y: y, hit: false, seed: Math.random() };
    if (kind === 'wreck') { o.w = 76; o.h = 136; o.hw = 33; o.hh = 60; o.heavy = true; o.damage = 1.5; o.color = ['#6a4636', '#4d5258', '#5a2c2c', '#3f4a3a'][irand(0, 3)]; }
    else if (kind === 'barrier') { o.w = 120; o.h = 36; o.hw = 56; o.hh = 14; o.heavy = true; o.damage = 1.5; }
    else if (kind === 'spikes') { o.w = 112; o.h = 30; o.hw = 52; o.hh = 18; o.heavy = true; o.damage = 2.5; }
    else if (kind === 'cones') { o.w = 46; o.h = 46; o.hw = 18; o.hh = 18; o.heavy = false; }
    else { o.w = 46; o.h = 46; o.hw = 19; o.hh = 19; o.heavy = false; }
    obstacles.push(o);
  }

  function spawnObstacles(y, count, withZombies) {
    var lanes = [0, 1, 2, 3].sort(function () { return Math.random() - 0.5; });
    var blocked = lanes.slice(0, Math.min(count, 2)); // never more than 2 of 4 lanes are blocked
    blocked.forEach(function (l) {
      var r = Math.random(), kind = r < 0.08 ? 'spikes' : (r < 0.4 ? 'wreck' : (r < 0.65 ? 'barrier' : (r < 0.85 ? 'cones' : 'barrel')));
      pushObstacle(kind, laneX(l) + rand(-8, 8), y + rand(-20, 20));
    });
    if (withZombies) {
      lanes.slice(count, count + 2).forEach(function (l) { if (Math.random() < 0.8) pushZombie(laneX(l) + rand(-30, 30), y + rand(-40, 40), false); });
    }
  }

  function spawnRow() {
    var d = diff(), y = -190, r = Math.random();
    var obsChance = 0.34 + 0.14 * d, mixChance = 0.16 + 0.1 * d;
    if (r < obsChance) spawnObstacles(y, 1 + ((d > 0.25 && Math.random() < 0.4 + 0.3 * d) ? 1 : 0), false);
    else if (r < obsChance + mixChance) spawnObstacles(y, 1, true);
    else spawnZombieGroup(y, d);
    if (Math.random() < Math.min(0.95, (0.3 + 0.2 * d) * 1.45)) spawnShoulderZombie(y - rand(0, 200));
  }

  function rowSpacing() { return Math.max(380, 470 - 130 * diff() + rand(-40, 40)); }

  function spawnDecor(y) {
    var r = Math.random(), left = Math.random() < 0.5, o = { y: y, rot: rand(0, 6.28), seed: Math.random() };
    if (r < 0.28) { o.type = 'tree'; o.x = left ? rand(20, 290) : rand(990, 1260); o.r = rand(18, 38); }
    else if (r < 0.42) { o.type = 'shell'; o.x = left ? rand(30, 280) : rand(1000, 1250); o.rot = rand(-0.6, 0.6) + (left ? 0.2 : -0.2); }
    else if (r < 0.58) { o.type = 'lamp'; o.x = left ? ROAD_L - 30 : ROAD_R + 30; }
    else if (r < 0.72) { o.type = 'rock'; o.x = left ? rand(10, 300) : rand(980, 1270); o.r = rand(10, 24); }
    else if (r < 0.88) { o.type = 'crack'; o.x = rand(ROAD_L + 20, ROAD_R - 20); }
    else { o.type = 'stain'; o.x = rand(ROAD_L + 20, ROAD_R - 20); o.r = rand(18, 40); }
    decor.push(o);
  }

  function prefillDecor() {
    decor = [];
    for (var y = -100; y < H + 60; y += 85) if (Math.random() < 0.8) spawnDecor(y + rand(-20, 20));
    decorDist = 120;
  }

  // ---------------------------------------------------------------- effects
  function addP(x, y, vx, vy, life, size, color, anchored) {
    if (particles.length > 520) particles.shift();
    particles.push({ x: x, y: y, vx: vx, vy: vy, life: life, max: life, size: size, color: color, anchored: !!anchored });
  }
  function floatText(str, x, y, color) { floaters.push({ s: str, x: x, y: y, life: 1.1, color: color }); }
  function addRing(x, y, max, color, life) { rings.push({ x: x, y: y, r: 10, max: max, life: life, t: 0, color: color }); }

  function splat(x, y, impactSpeed) {
    // Layered, stylized arcade splatter: a central burst, flying droplets,
    // and a temporary irregular road decal. No graphic body detail.
    var power = clamp((impactSpeed || player.speed) / MAX_SPEED, 0.35, 1.35);
    var count = Math.round(48 + power * 30);
    var palette = ['#b10f24', '#d71932', '#7e1020', '#e43a45', '#4f101b'];
    for (var i = 0; i < count; i++) {
      var a = rand(0, 6.2832), s = rand(95, 300) * power;
      var blood = Math.random() < 0.88;
      addP(x + rand(-5, 5), y + rand(-4, 4), Math.cos(a) * s, Math.sin(a) * s - rand(15, 95),
        rand(0.38, 0.9), rand(2.5, 8.5) * power, blood ? palette[irand(0, palette.length - 1)] : '#6f9634', true);
    }
    // A few larger droplets give the hit a readable, punchy silhouette.
    for (var j = 0; j < 14; j++) {
      var da = rand(0, 6.2832), ds = rand(150, 340) * power;
      addP(x, y, Math.cos(da) * ds, Math.sin(da) * ds, rand(0.45, 0.85), rand(7, 12) * power,
        palette[irand(0, palette.length - 1)], true);
    }
    var lobes = [];
    for (var k = 0; k < 13; k++) lobes.push({
      a: k / 13 * 6.2832 + rand(-0.18, 0.18),
      r: rand(0.58, 1.25),
      size: rand(0.55, 1.15)
    });
    bloodDecals.push({ x: x, y: y, rx: rand(22, 34) * power, ry: rand(13, 22) * power,
      life: rand(5.5, 8.5), max: 8.5, rot: rand(-0.7, 0.7), lobes: lobes,
      color: palette[irand(0, palette.length - 1)] });
    if (bloodDecals.length > 24) bloodDecals.shift();
    addRing(x, y, 78 * power, 'rgba(215,25,50,', 0.34);
  }

  // Arcade-style zombie dismemberment: detached cartoon limbs, with no exposed anatomy.
  function burstZombieParts(x, y, impactSpeed) {
    var count = 2 + (Math.random() < 0.55 ? 1 : 0);
    var types = ['arm', 'arm', 'leg'];
    for (var i = 0; i < count; i++) {
      var a = rand(-Math.PI, Math.PI), speed = rand(100, 245) * clamp(impactSpeed / MAX_SPEED, 0.55, 1.25);
      detachedParts.push({ x: x + rand(-8, 8), y: y + rand(-6, 6),
        vx: Math.cos(a) * speed, vy: Math.sin(a) * speed - rand(40, 115),
        rot: rand(-3, 3), spin: rand(-9, 9), life: rand(1.1, 2.1), max: 2.1,
        type: types[irand(0, types.length - 1)], flip: Math.random() < 0.5 ? -1 : 1,
        color: Math.random() < 0.5 ? '#82bd3f' : '#6b9634', sleeve: Math.random() < 0.5 ? '#4b5a3e' : '#6c4634' });
    }
    if (detachedParts.length > 36) detachedParts.splice(0, detachedParts.length - 36);
  }

  function updateDetachedParts(dt, scrollDelta) {
    for (var i = detachedParts.length - 1; i >= 0; i--) {
      var part = detachedParts[i];
      part.life -= dt;
      part.vy += 260 * dt;
      part.x += part.vx * dt;
      part.y += part.vy * dt + scrollDelta;
      part.rot += part.spin * dt;
      part.vx *= Math.exp(-1.25 * dt);
      if (part.y > H + 100 || part.life <= 0) detachedParts.splice(i, 1);
    }
  }

  function drawDetachedParts() {
    for (var i = 0; i < detachedParts.length; i++) {
      var p = detachedParts[i], alpha = Math.min(1, p.life / 0.35);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(p.flip, 1); ctx.globalAlpha = alpha;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (p.type === 'arm') {
        ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(2, 3); ctx.lineTo(19, 15); ctx.stroke();
        ctx.strokeStyle = p.sleeve; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(-1, 0); ctx.lineTo(10, 7); ctx.stroke();
        ctx.strokeStyle = p.color; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(10, 7); ctx.lineTo(23, 15); ctx.stroke();
        ctx.fillStyle = '#9bd65b'; ctx.beginPath(); ctx.arc(25, 16, 4, 0, 6.2832); ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(2, 3); ctx.lineTo(4, 23); ctx.stroke();
        ctx.strokeStyle = p.color; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(2, 18); ctx.stroke();
        ctx.strokeStyle = '#382f2a'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(2, 18); ctx.lineTo(13, 22); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function updateBloodDecals(dt, scrollDelta) {
    for (var i = bloodDecals.length - 1; i >= 0; i--) {
      var b = bloodDecals[i];
      b.y += scrollDelta;
      b.life -= dt;
      if (b.life <= 0 || b.y > H + 100) bloodDecals.splice(i, 1);
    }
  }

  function drawBloodDecals() {
    for (var i = 0; i < bloodDecals.length; i++) {
      var b = bloodDecals[i];
      var alpha = 0.72 * clamp(b.life / 1.2, 0, 1);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.globalAlpha = alpha;
      ctx.fillStyle = '#310b13';
      ctx.beginPath(); ctx.ellipse(2, 3, b.rx * 1.05, b.ry * 1.08, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.ellipse(0, 0, b.rx * 0.78, b.ry * 0.76, 0, 0, 6.2832); ctx.fill();
      for (var j = 0; j < b.lobes.length; j++) {
        var l = b.lobes[j], rr = b.rx * l.r;
        ctx.beginPath(); ctx.ellipse(Math.cos(l.a) * rr, Math.sin(l.a) * rr * 0.62,
          b.rx * 0.2 * l.size, b.ry * 0.18 * l.size, l.a, 0, 6.2832); ctx.fill();
      }
      // Short tapered flicks make the silhouette read as splatter, not a blob.
      ctx.strokeStyle = b.color; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      for (var k = 0; k < 5; k++) {
        var a = k * 1.2566 + b.rot;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * b.rx * 0.65, Math.sin(a) * b.ry * 0.6);
        ctx.lineTo(Math.cos(a) * b.rx * 1.5, Math.sin(a) * b.ry * 1.45); ctx.stroke();
      }
      ctx.restore();
    }
  }
  function sparks(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, 6.28), s = rand(120, 380);
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.2, 0.5), rand(2, 4), Math.random() < 0.5 ? '#ffb02e' : '#fff1b0', false);
    }
  }
  function explosion(x, y) {
    var i, a, s;
    for (i = 0; i < 90; i++) {
      a = rand(0, 6.28); s = rand(60, 520);
      addP(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.5, 1.4), rand(4, 14), ['#ff6a00', '#ffb02e', '#ffe07a', '#3a3a3a', '#c1121f'][irand(0, 4)], false);
    }
    addRing(x, y, 260, 'rgba(255,170,60,', 0.7);
  }

  // ---------------------------------------------------------------- game flow
  function startRun() {
    newRun();
    state = 'playing';
    Input.flush();
    if (window.Sfx) window.Sfx.start();
  }

  function startDying() {
    state = 'dying'; dyingT = 0; player.wrecked = true; player.vx = 0;
    shake = 30; flash = 0.6;
    explosion(player.x, PLAYER_Y);
    if (window.Sfx) { window.Sfx.boom(); window.Sfx.engine(0, false); }
    Input.flush();
  }

  function toGameOver(kind) {
    state = 'gameover'; overKind = kind; overT = 0;
    if (kind === 'escaped') { score += 2000; if (window.Sfx) window.Sfx.win(); }
    newBest = Math.floor(score) > best;
    if (newBest) { best = Math.floor(score); saveBest(); }
    if (window.Sfx) window.Sfx.engine(0, false);
    Input.flush();
  }

  // ---------------------------------------------------------------- update
  function hitsRectCircle(px, py, hw, hh, cx, cy, r) {
    var dx = Math.abs(cx - px), dy = Math.abs(cy - py);
    if (dx > hw + r || dy > hh + r) return false;
    if (dx <= hw || dy <= hh) return true;
    var ex = dx - hw, ey = dy - hh;
    return ex * ex + ey * ey <= r * r;
  }

  function updateScenery(dt, scrollDelta) {
    scroll += scrollDelta;
    decorDist -= scrollDelta;
    while (decorDist <= 0) { spawnDecor(-120); decorDist += rand(90, 190); }
    for (var i = decor.length - 1; i >= 0; i--) {
      decor[i].y += scrollDelta;
      if (decor[i].y > H + 160) decor.splice(i, 1);
    }
  }

  function updateParticles(dt, scrollDelta) {
    var i;
    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt + (p.anchored ? scrollDelta : 0);
      p.vx *= Math.exp(-2.2 * dt); p.vy *= Math.exp(-2.2 * dt);
    }
    for (i = floaters.length - 1; i >= 0; i--) {
      floaters[i].life -= dt; floaters[i].y -= 55 * dt;
      if (floaters[i].life <= 0) floaters.splice(i, 1);
    }
    for (i = rings.length - 1; i >= 0; i--) {
      var r = rings[i]; r.t += dt;
      if (r.t >= r.life) { rings.splice(i, 1); continue; }
      r.r = 10 + (r.max - 10) * (r.t / r.life);
    }
    shake = Math.max(0, shake - 40 * dt);
    flash = Math.max(0, flash - 1.6 * dt);
  }

  function updatePlayer(dt, sdt) {
    var p = player, held = Input.held;
    var steer = Input.axisX();
    // A quick left-to-right or right-to-left switch triggers a short, controllable drift.
    if (steer !== 0 && p.lastSteer !== 0 && steer !== p.lastSteer) {
      p.driftT = 0.48; p.driftDir = steer;
      for (var skid = 0; skid < 5; skid++) {
        addP(p.x + rand(-17, 17), PLAYER_Y + rand(17, 28), rand(-50, 50), rand(15, 95), rand(0.25, 0.5), rand(2, 4), '#a9c5d8', false);
      }
    }
    if (steer !== 0) p.lastSteer = steer;
    else p.lastSteer = 0;
    p.driftT = Math.max(0, p.driftT - dt);
    // Throttle / brake (opposite keys cancel to coasting)
    var up = held.up && !held.down, down = held.down && !held.up;
    if (up) p.speed += ACCEL * sdt;
    else if (down) p.speed -= BRAKE * sdt;
    else p.speed -= COAST * sdt;
    p.speed = clamp(p.speed, 0, MAX_SPEED);

    // Steering (real-time so it always feels responsive; only matters when an arrow is held)
    var steerScale = 0.65 + 0.35 * (p.speed / MAX_SPEED);
    var target = steer * STEER_SPEED * steerScale;
    var dv = target - p.vx, maxDv = STEER_ACCEL * dt;
    p.vx += clamp(dv, -maxDv, maxDv);
    if (p.driftT > 0) {
      // Brief lateral carry adds a readable slide without taking control away.
      p.vx += p.driftDir * 115 * dt;
      p.vx = clamp(p.vx, -STEER_SPEED * 1.18, STEER_SPEED * 1.18);
    }
    p.x += p.vx * dt;

    // Road edges: gentle scrape, never fatal
    var minX = ROAD_L + CAR_W / 2 + 4, maxX = ROAD_R - CAR_W / 2 - 4;
    p.scrape = 0;
    if (p.x < minX) { p.x = minX; if (p.vx < -40) p.scrape = 1; p.vx = Math.max(p.vx, 0); }
    if (p.x > maxX) { p.x = maxX; if (p.vx > 40) p.scrape = 1; p.vx = Math.min(p.vx, 0); }
    if (p.scrape) {
      p.speed = Math.max(80, p.speed - 70 * sdt);
      if (Math.random() < 0.5) addP(p.x < ROAD_CX ? ROAD_L : ROAD_R, PLAYER_Y + rand(-30, 40), rand(-60, 60), rand(-60, 60), 0.25, 2.5, '#ffb02e', false);
    }

    p.inv = Math.max(0, p.inv - dt);
    p.flash = Math.max(0, p.flash - dt);
  }

  function hitZombie(z) {
    z.hit = true; z.t = 0;
    z.fx = (z.x >= player.x ? 1 : -1) * rand(300, 460); z.fy = rand(40, 140); z.spin = rand(-12, 12);
    streak++; kills++;
    var pts = 100 + 25 * Math.min(streak - 1, 8);
    score += pts;
    floatText('+' + pts, z.x, z.y - 20, '#ffd35a');
    splat(z.x, z.y, player.speed);
    burstZombieParts(z.x, z.y, player.speed);
    shake = Math.max(shake, player.speed > MAX_SPEED * 0.72 ? 8 : 5);
    player.speed *= 0.97;
    if (window.Sfx) window.Sfx.crush();
  }

  function hitObstacle(o) {
    o.hit = true;
    var severity = o.damage || (o.heavy ? 1.5 : 1);
    player.speed = Math.min(player.speed, Math.max(95, player.speed * (severity >= 2 ? 0.28 : (o.heavy ? 0.45 : 0.72))));
    player.inv = severity >= 2 ? 1.65 : 1.2; player.flash = severity >= 2 ? 0.75 : 0.4;
    player.vx += (player.x < o.x ? -1 : 1) * (severity >= 2 ? 390 : 260);
    streak = 0; cleanTime = 0;
    shake = Math.max(shake, severity >= 2 ? 25 : (o.heavy ? 16 : 9));
    sparks(player.x + rand(-20, 20), PLAYER_Y - 30, severity >= 2 ? 34 : (o.heavy ? 22 : 12));
    floatText(severity >= 2 ? 'CRITICAL DAMAGE!' : 'CRASH!', player.x, PLAYER_Y - 80, severity >= 2 ? '#ff315d' : '#ff5a3c');
    if (window.Sfx) window.Sfx.crash();
  }

  function updateEntities(dt, sdt, scrollDelta) {
    var i;
    nextRowDist -= scrollDelta;
    while (nextRowDist <= 0) { spawnRow(); nextRowDist += rowSpacing(); }

    for (i = zombies.length - 1; i >= 0; i--) {
      var z = zombies[i];
      if (z.hit) {
        z.t += dt;
        z.x += z.fx * dt; z.y += z.fy * dt + scrollDelta; z.rot += z.spin * dt;
        if (z.t > 0.45 || z.y > H + 120) zombies.splice(i, 1);
        continue;
      }
      z.phase += sdt * 7;
      z.x += (z.vx + Math.sin(z.phase * 0.3) * z.sway) * sdt;
      z.y += scrollDelta + 25 * sdt;
      if (z.y > H + 120) { zombies.splice(i, 1); continue; }
      if (!player.wrecked && hitsRectCircle(player.x, PLAYER_Y, CAR_HW, CAR_HH, z.x, z.y, z.r - 2)) hitZombie(z);
    }

    for (i = obstacles.length - 1; i >= 0; i--) {
      var o = obstacles[i];
      o.y += scrollDelta;
      if (o.y > H + 200) { obstacles.splice(i, 1); continue; }
      if (!o.hit && player.inv <= 0 && !player.wrecked &&
          Math.abs(o.x - player.x) < o.hw + CAR_HW && Math.abs(o.y - PLAYER_Y) < o.hh + CAR_HH) hitObstacle(o);
    }
  }

  function updatePursuit(dt, sdt) {
    var d = diff();
    pursuer.stun = Math.max(0, pursuer.stun - dt);
    var pursuerSpeed = 300 + 155 * d;
    // The chase only advances while the player is acting (any arrow held): stepping away never costs a loss.
    if (Input.anyArrow()) {
      var rate = clamp(pursuerSpeed - player.speed, -420, MAX_CLOSE); // positive = closing in
      if (pursuer.stun > 0) rate = -90;                                // time-frozen: falls back
      gap -= rate * sdt;
    }
    gap = clamp(gap, 0, GAP_MAX);
    pursuer.x += (player.x - pursuer.x) * (1 - Math.exp(-2.2 * sdt));

    var lvl = gap < WARN2 ? 2 : (gap < WARN1 ? 1 : 0);
    warnTimer -= dt;
    if (lvl > 0 && warnTimer <= 0) {
      if (window.Sfx) window.Sfx.warn();
      warnTimer = lvl === 2 ? 0.45 : 1.0;
    }
    warnLevel = lvl;
  }

  function usePulse() {
    pulseCd = PULSE_CD; pursuer.stun = PULSE_STUN;
    gap = Math.min(GAP_MAX, gap + PULSE_PUSH);
    addRing(player.x, PLAYER_Y, 420, 'rgba(255,230,160,', 0.8);
    addRing(player.x, PLAYER_Y, 280, 'rgba(255,255,255,', 0.55);
    flash = 0.35;
    floatText('TIME PULSE', player.x, PLAYER_Y - 90, '#ffe9a8');
    if (window.Sfx) window.Sfx.pulse();
  }

  function fireGun() {
    player.gunCd = 0.19;
    bullets.push({ x: player.x - 12, y: PLAYER_Y - 48, vx: -10, vy: -760, life: 0.9 });
    bullets.push({ x: player.x + 12, y: PLAYER_Y - 48, vx: 10, vy: -760, life: 0.9 });
    if (bullets.length > 50) bullets.splice(0, bullets.length - 50);
    particles.push({ x: player.x - 12, y: PLAYER_Y - 48, vx: rand(-25,25), vy: rand(-100,-35), life: 0.08, max: 0.08, color: '#ffd77a', size: 5 });
    particles.push({ x: player.x + 12, y: PLAYER_Y - 48, vx: rand(-25,25), vy: rand(-100,-35), life: 0.08, max: 0.08, color: '#ffd77a', size: 5 });
    if (window.Sfx && window.Sfx.shot) window.Sfx.shot();
  }

  function updateBullets(dt, scrollDelta) {
    for (var i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      var struck = false;
      for (var j = zombies.length - 1; j >= 0; j--) {
        var z = zombies[j];
        if (!z.hit && Math.abs(z.x - b.x) < z.r + 4 && Math.abs(z.y - b.y) < z.r + 8) {
          hitZombie(z); struck = true; break;
        }
      }
      if (struck || b.life <= 0 || b.y < -30 || b.x < ROAD_L || b.x > ROAD_R) bullets.splice(i, 1);
    }
  }

  function drawBullets() {
    ctx.save(); ctx.lineCap = 'round';
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      ctx.strokeStyle = 'rgba(255,184,74,0.35)'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(b.x, b.y + 20); ctx.lineTo(b.x, b.y - 6); ctx.stroke();
      ctx.strokeStyle = '#fff0b0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(b.x, b.y + 15); ctx.lineTo(b.x, b.y - 7); ctx.stroke();
    }
    ctx.restore();
  }

  function updatePlaying(dt) {
    var any = Input.anyArrow();
    var target = any ? 1 : IDLE_SCALE, k = any ? 14 : 4;
    ts += (target - ts) * (1 - Math.exp(-k * dt));
    var sdt = dt * ts;
    lastSdt = sdt;
    hintT += dt;
    pulseCd = Math.max(0, pulseCd - dt);
    if (Input.pressed.space && pulseCd <= 0) usePulse();
    if (Input.held.space && (player.gunCd || 0) <= 0) fireGun();
    player.gunCd = Math.max(0, (player.gunCd || 0) - dt);

    updatePlayer(dt, sdt);
    var scrollDelta = player.speed * sdt;
    updateScenery(dt, scrollDelta);
    updateEntities(dt, sdt, scrollDelta);
    updateBullets(dt, scrollDelta);
    updatePursuit(dt, sdt);

    // scoring & progression (driving time only advances while the world moves)
    playTime += sdt;
    score += player.speed * 0.12 * sdt;
    cleanTime += sdt;
    if (cleanTime >= 10) { cleanTime -= 10; score += 250; floatText('CLEAN DRIVING +250', player.x, PLAYER_Y - 120, '#9be15d'); }

    if (window.Sfx) window.Sfx.engine(player.speed / MAX_SPEED * (0.35 + 0.65 * ts), true);

    updateParticles(dt, scrollDelta);
    updateDetachedParts(dt, scrollDelta);
    updateBloodDecals(dt, scrollDelta);

    if (gap <= 0) startDying();
    else if (playTime >= ESCAPE_TIME) toGameOver('escaped');
  }

  function updateDying(dt) {
    dyingT += dt;
    ts += (0.3 - ts) * (1 - Math.exp(-4 * dt));
    var sdt = dt * ts;
    player.speed = Math.max(0, player.speed - 520 * dt);
    var scrollDelta = player.speed * sdt;
    updateScenery(dt, scrollDelta);
    for (var i = 0; i < obstacles.length; i++) obstacles[i].y += scrollDelta;
    for (var j = 0; j < zombies.length; j++) zombies[j].y += scrollDelta;
    if (Math.random() < 0.6) addP(player.x + rand(-20, 20), PLAYER_Y + rand(-30, 30), rand(-40, 40), rand(-160, -60), rand(0.4, 0.9), rand(5, 12), Math.random() < 0.5 ? '#ff6a00' : '#2a2a2a', false);
    updateParticles(dt, scrollDelta);
    updateDetachedParts(dt, scrollDelta);
    updateBloodDecals(dt, scrollDelta);
    if (dyingT >= DYING_TIME) toGameOver('caught');
  }

  function updateGameOver(dt) {
    overT += dt;
    updateParticles(dt, 0);
    updateDetachedParts(dt, 0);
    updateBloodDecals(dt, 0);
    // Fresh Z press only, and never during the first second.
    if (overT >= OVER_LOCK && Input.pressed.z) startRun();
  }

  function updateTitle(dt) {
    ts = 1;
    var sd = idleDemoSpeed * dt;
    updateScenery(dt, sd);
    if (Input.pressed.z) startRun();
  }

  function update(dt) {
    clock += dt;
    lightningTimer -= dt;
    lightningFlash = Math.max(0, lightningFlash - dt * 2.8);
    if (lightningTimer <= 0) {
      lightningFlash = rand(0.45, 0.9);
      lightningTimer = rand(5.5, 10.5);
      lightningSeed = rand(0, W);
      if (window.Sfx && window.Sfx.thunder) window.Sfx.thunder();
    }
    for (var ri = 0; ri < rainDrops.length; ri++) {
      var rd = rainDrops[ri]; rd.x += rd.drift * dt; rd.y += rd.speed * dt;
      if (rd.y > H + 25 || rd.x < -30) { rd.x = rand(0, W + 120); rd.y = rand(-90, -20); }
    }
    Input.poll();
    if (state === 'title') updateTitle(dt);
    else if (state === 'playing') updatePlaying(dt);
    else if (state === 'dying') updateDying(dt);
    else updateGameOver(dt);
  }

  // ---------------------------------------------------------------- drawing: world
  function drawBackground() {
    ctx.fillStyle = '#16110f'; ctx.fillRect(0, 0, W, H);
    var i;
    for (i = 0; i < blotches.length; i++) {
      var b = blotches[i], by = wrap(b.y + scroll, H + 140) - 70;
      ctx.fillStyle = b.c; ctx.beginPath(); ctx.ellipse(b.x, by, b.rx, b.ry, 0, 0, 6.2832); ctx.fill();
    }
    // gravel shoulders
    ctx.fillStyle = '#2e2924'; ctx.fillRect(ROAD_L - 60, 0, 60, H); ctx.fillRect(ROAD_R, 0, 60, H);
    for (i = 0; i < speckles.length; i++) {
      var s = speckles[i], sy = wrap(s.y + scroll, H);
      ctx.fillStyle = s.c; ctx.fillRect(s.x, sy, s.s, s.s);
    }
    // asphalt
    var g = ctx.createLinearGradient(ROAD_L, 0, ROAD_R, 0);
    g.addColorStop(0, '#222226'); g.addColorStop(0.5, '#2f2f34'); g.addColorStop(1, '#222226');
    ctx.fillStyle = g; ctx.fillRect(ROAD_L, 0, ROAD_R - ROAD_L, H);
    // rumble strips (road boundary): muted red / grey blocks
    var off = wrap(scroll, 80), y;
    for (y = -80 + off; y < H; y += 80) {
      ctx.fillStyle = '#a02a2a'; ctx.fillRect(ROAD_L - 14, y, 14, 40); ctx.fillRect(ROAD_R, y, 14, 40);
      ctx.fillStyle = '#b9b9bd'; ctx.fillRect(ROAD_L - 14, y + 40, 14, 40); ctx.fillRect(ROAD_R, y + 40, 14, 40);
    }
    // edge lines
    ctx.fillStyle = '#9a9aa0'; ctx.fillRect(ROAD_L + 6, 0, 4, H); ctx.fillRect(ROAD_R - 10, 0, 4, H);
    // lane markings (animated by scroll)
    var doff = wrap(scroll, 120);
    for (var k = 1; k < LANES; k++) {
      var x = ROAD_L + k * LANE_W;
      if (k === 2) {
        ctx.fillStyle = '#b8892a'; ctx.fillRect(x - 7, 0, 4, H); ctx.fillRect(x + 3, 0, 4, H);
      } else {
        ctx.fillStyle = '#8c8c92';
        for (y = -120 + doff; y < H; y += 120) ctx.fillRect(x - 3, y, 6, 64);
      }
    }
  }

  function drawDecor(under) {
    for (var i = 0; i < decor.length; i++) {
      var o = decor[i], isRoad = (o.type === 'crack' || o.type === 'stain');
      if (isRoad !== under) continue;
      var y = o.y;
      ctx.save(); ctx.translate(o.x, y);
      if (o.type === 'tree') {
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(0, 0, o.r * 1.5, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = '#2b2118'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        for (var b = 0; b < 6; b++) { var a = o.rot + b * 1.047; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * o.r * 1.6, Math.sin(a) * o.r * 1.6); ctx.stroke(); }
        ctx.fillStyle = '#3a2d20'; ctx.beginPath(); ctx.arc(0, 0, o.r * 0.35, 0, 6.2832); ctx.fill();
      } else if (o.type === 'shell') {
        ctx.rotate(o.rot);
        ctx.fillStyle = '#2b2623'; rrect(ctx, -34, -62, 68, 124, 14); ctx.fill();
        ctx.strokeStyle = '#4a3f38'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#17120f'; rrect(ctx, -24, -30, 48, 36, 6); ctx.fill();
        ctx.fillStyle = '#5a3a24'; ctx.fillRect(-20, 24, 40, 14);
      } else if (o.type === 'lamp') {
        var fl = 0.6 + 0.4 * Math.sin(clock * 7 + o.seed * 40) * (o.seed > 0.5 ? 1 : 0.3);
        ctx.globalCompositeOperation = 'lighter';
        var lg = ctx.createRadialGradient(0, 0, 4, 0, 0, 90);
        lg.addColorStop(0, 'rgba(255,170,60,' + (0.35 * fl) + ')'); lg.addColorStop(1, 'rgba(255,170,60,0)');
        ctx.fillStyle = lg; ctx.fillRect(-90, -90, 180, 180);
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, 6.2832); ctx.fill();
      } else if (o.type === 'rock') {
        ctx.fillStyle = '#3b3733'; ctx.beginPath();
        for (var p = 0; p < 7; p++) { var pa = o.rot + p * 0.897, pr = o.r * (0.8 + 0.4 * ((p * 7 + Math.floor(o.seed * 10)) % 3) / 2); ctx.lineTo(Math.cos(pa) * pr, Math.sin(pa) * pr); }
        ctx.closePath(); ctx.fill();
      } else if (o.type === 'crack') {
        ctx.strokeStyle = '#141416'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -40);
        ctx.lineTo(10 * (o.seed - 0.5) * 4, -15); ctx.lineTo(-8, 10); ctx.lineTo(6, 32); ctx.lineTo(-4, 55); ctx.stroke();
      } else if (o.type === 'stain') {
        ctx.fillStyle = 'rgba(8,8,10,0.55)'; ctx.beginPath(); ctx.ellipse(0, 0, o.r, o.r * 0.6, o.rot, 0, 6.2832); ctx.fill();
      }
      ctx.restore();
    }
  }

  // Generic top-down car (front = up).
  function drawCar(cx, cy, w, h, o) {
    ctx.save(); ctx.translate(cx, cy); if (o.rot) ctx.rotate(o.rot);
    var hw = w / 2, hh = h / 2;
    ctx.fillStyle = '#0c0c0c';
    var wy = [-hh * 0.62, hh * 0.32];
    for (var i = 0; i < 2; i++) { ctx.fillRect(-hw - 4, wy[i], 9, hh * 0.32); ctx.fillRect(hw - 5, wy[i], 9, hh * 0.32); }
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; rrect(ctx, -hw + 5, -hh + 8, w, h, w * 0.22); ctx.fill();  // soft shadow
    ctx.fillStyle = o.body; rrect(ctx, -hw, -hh, w, h, w * 0.22); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = o.edge || 'rgba(0,0,0,0.6)'; ctx.stroke();
    ctx.fillStyle = o.dark; ctx.fillRect(-hw + 2, hh * 0.55, w - 4, hh * 0.3);      // rear deck shade
    if (o.stripe) { ctx.fillStyle = o.stripe; ctx.fillRect(-w * 0.09, -hh + 4, w * 0.18, h - 8); }
    ctx.fillStyle = o.glass;                                                             // windshield + rear window
    ctx.beginPath(); ctx.moveTo(-w * 0.34, -hh * 0.10); ctx.lineTo(w * 0.34, -hh * 0.10); ctx.lineTo(w * 0.27, -hh * 0.38); ctx.lineTo(-w * 0.27, -hh * 0.38); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-w * 0.30, hh * 0.30); ctx.lineTo(w * 0.30, hh * 0.30); ctx.lineTo(w * 0.34, hh * 0.52); ctx.lineTo(-w * 0.34, hh * 0.52); ctx.closePath(); ctx.fill();
    ctx.fillStyle = o.roof || o.body; ctx.fillRect(-w * 0.31, -hh * 0.08, w * 0.62, hh * 0.36);
    if (o.lights !== false) {
      ctx.fillStyle = o.head || '#fff6c8'; ctx.fillRect(-hw + 4, -hh + 2, w * 0.24, 8); ctx.fillRect(hw - 4 - w * 0.24, -hh + 2, w * 0.24, 8);
      ctx.fillStyle = '#ff2a2a'; ctx.fillRect(-hw + 4, hh - 8, w * 0.2, 6); ctx.fillRect(hw - 4 - w * 0.2, hh - 8, w * 0.2, 6);
    }
    if (o.extra) o.extra(hw, hh);
    ctx.restore();
  }

  function drawZombie(z) {
    ctx.save(); ctx.translate(z.x, z.y); ctx.rotate(z.rot);
    var alpha = z.hit ? clamp(1 - z.t / 0.45, 0, 1) : 1; ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(139,214,60,0.18)'; ctx.beginPath(); ctx.arc(0, 0, 30, 0, 6.2832); ctx.fill();   // readability halo
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(3, 4, 22, 14, 0, 0, 6.2832); ctx.fill();
    var sw = Math.sin(z.phase) * 9;
    ctx.strokeStyle = z.limb || '#6b8f3a'; ctx.lineWidth = 8; ctx.lineCap = 'round';                                // arms reaching forward
    ctx.beginPath(); ctx.moveTo(-14, 2); ctx.lineTo(-18, 24 + sw); ctx.moveTo(14, 2); ctx.lineTo(18, 24 - sw); ctx.stroke();
    ctx.fillStyle = z.shirt || '#4b5a3e'; ctx.beginPath(); ctx.ellipse(0, 0, 21, 13, 0, 0, 6.2832); ctx.fill();         // shoulders / torn shirt
    ctx.strokeStyle = '#0d0f0a'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = z.skin || '#8bd63c'; ctx.beginPath(); ctx.arc(0, 6, 11, 0, 6.2832); ctx.fill();                   // head
    ctx.strokeStyle = '#0d0f0a'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#2d3b1c'; ctx.beginPath(); ctx.arc(-4, 9, 2.2, 0, 6.2832); ctx.arc(4, 9, 2.2, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  function drawObstacle(o) {
    var blink = 0.5 + 0.5 * Math.sin(clock * 9 + o.seed * 20);
    ctx.save(); ctx.translate(o.x, o.y);
    if (o.hit) ctx.globalAlpha = 0.55;
    if (o.type === 'wreck') {
      ctx.rotate((o.seed - 0.5) * 0.25);
      var hw = o.w / 2, hh = o.h / 2;
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; rrect(ctx, -hw + 5, -hh + 6, o.w, o.h, 14); ctx.fill();
      ctx.fillStyle = o.color; rrect(ctx, -hw, -hh, o.w, o.h, 14); ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = '#d6c8a6'; ctx.stroke();                                          // pale outline so wrecks stay readable
      ctx.fillStyle = '#0f0f12'; ctx.fillRect(-hw + 10, -hh * 0.35, o.w - 20, hh * 0.45);                    // smashed windows
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-hw + 8, hh * 0.4, o.w * 0.5, hh * 0.35);              // burn mark
      ctx.strokeStyle = '#8a8f96'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-hw + 12, -hh * 0.3); ctx.lineTo(0, -hh * 0.05); ctx.lineTo(hw - 14, -hh * 0.25); ctx.stroke();
      ctx.fillStyle = 'rgba(255,170,40,' + (0.35 + 0.5 * blink) + ')'; ctx.fillRect(-hw + 3, -hh + 4, 8, 8); ctx.fillRect(hw - 11, -hh + 4, 8, 8); // hazard lights
    } else if (o.type === 'barrier') {
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(-56, -12, 120, 36);
      ctx.fillStyle = '#c9c9c9'; rrect(ctx, -60, -18, 120, 36, 6); ctx.fill();
      ctx.save(); rrect(ctx, -60, -18, 120, 36, 6); ctx.clip();
      ctx.fillStyle = '#ff7a1a';
      for (var s = -70; s < 70; s += 36) { ctx.beginPath(); ctx.moveTo(s, 18); ctx.lineTo(s + 16, 18); ctx.lineTo(s + 34, -18); ctx.lineTo(s + 18, -18); ctx.closePath(); ctx.fill(); }
      ctx.restore();
      ctx.lineWidth = 3; ctx.strokeStyle = '#111'; rrect(ctx, -60, -18, 120, 36, 6); ctx.stroke();
    } else if (o.type === 'spikes') {
      // High-damage road spike strip: hazard glow, metal base and sharp teeth.
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,35,75,' + (0.12 + blink * 0.16) + ')';
      ctx.fillRect(-58, -19, 116, 38);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#272b34'; rrect(ctx, -56, -14, 112, 28, 4); ctx.fill();
      ctx.strokeStyle = '#ff315d'; ctx.lineWidth = 2; ctx.strokeRect(-55, -13, 110, 26);
      for (var sp = -48; sp <= 48; sp += 12) {
        ctx.fillStyle = '#dfe5ed'; ctx.beginPath(); ctx.moveTo(sp - 5, 9); ctx.lineTo(sp, -10); ctx.lineTo(sp + 5, 9); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#687386'; ctx.lineWidth = 1; ctx.stroke();
      }
      ctx.fillStyle = '#ff315d'; ctx.fillRect(-51, -3, 102, 3);
    } else if (o.type === 'cones') {
      for (var c = 0; c < 3; c++) {
        var cx = (c - 1) * 16, cy = (c === 1 ? -8 : 8);
        ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.arc(cx, cy, 11, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 11, 0, 6.2832); ctx.stroke();
      }
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.arc(3, 4, 22, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#b3201a'; ctx.beginPath(); ctx.arc(0, 0, 21, 0, 6.2832); ctx.fill();

  function cone(x, y, len, w0, w1, rgb, a) {
    var g = ctx.createLinearGradient(0, y, 0, y - len);

    ctx.moveTo(x - w0, y); ctx.lineTo(x + w0, y); ctx.lineTo(x + w1, y - len); ctx.lineTo(x - w1, y - len); ctx.closePath(); ctx.fill();
  }

  function pursuerY() { return PLAYER_Y + 118 + gap * 0.2; }

  function drawPursuer() {
    var y = pursuerY(), x = pursuer.x, frozen = pursuer.stun > 0;
    var close = clamp(1 - gap / GAP_MAX, 0, 1);
    ctx.globalCompositeOperation = 'lighter';
    cone(x - 22, y - 70, 340, 14, 70, frozen ? '200,230,255' : '255,245,210', 0.18 + 0.3 * close);
    cone(x + 22, y - 70, 340, 14, 70, frozen ? '200,230,255' : '255,245,210', 0.18 + 0.3 * close);
    ctx.globalCompositeOperation = 'source-over';
    if (y - 75 > H + 10) return;

    drawCar(x, y, 84, 142, {
      body: frozen ? '#3b4a5a' : '#17171c', dark: '#0b0b0e', stripe: frozen ? '#9fc4e8' : '#b3121b', glass: '#05060a', roof: frozen ? '#2d3a48' : '#0f0f13',

        ctx.fillStyle = flick ? '#ff2230' : '#ffb02e'; ctx.fillRect(-22, -hh * 0.02, 20, 9);                      // roof light bar
        ctx.fillStyle = flick ? '#ffb02e' : '#ff2230'; ctx.fillRect(2, -hh * 0.02, 20, 9);

      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 40); ctx.moveTo(x, y); ctx.lineTo(x + 26, y + 10); ctx.stroke();
    }
  }

  // Layered exhaust plume: hot core, turbulent orange sheath, and drifting sparks.
  // Drawn before the car so the plume naturally disappears beneath its rear bumper.
  function drawBoosterTrail() {
    if (state !== 'playing' || !Input.held.up || player.wrecked) return;
    var p = player, y = PLAYER_Y + CAR_H * 0.43;
    var power = clamp(player.speed / MAX_SPEED, 0.35, 1.15);
    var flick = 0.78 + 0.22 * Math.sin(clock * 47) * Math.sin(clock * 23 + 1.2);
    var length = (30 + 34 * power) * flick;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // Broad heat haze / outer plume.
    var outer = ctx.createLinearGradient(0, y, 0, y + length + 20);
    outer.addColorStop(0, 'rgba(255,70,12,0.72)');
    outer.addColorStop(0.28, 'rgba(255,95,18,0.38)');
    outer.addColorStop(0.72, 'rgba(255,48,8,0.12)');
    outer.addColorStop(1, 'rgba(255,35,5,0)');
    ctx.fillStyle = outer;
    ctx.beginPath();
    ctx.moveTo(p.x - 8, y); ctx.bezierCurveTo(p.x - 20, y + length * 0.26, p.x - 13 + Math.sin(clock * 31) * 7, y + length * 0.68, p.x + Math.sin(clock * 19) * 9, y + length + 16);
    ctx.bezierCurveTo(p.x + 15 + Math.cos(clock * 27) * 5, y + length * 0.65, p.x + 19, y + length * 0.25, p.x + 8, y); ctx.closePath(); ctx.fill();
    // Twin exhaust jets with a bright white-yellow core and orange edge.
    for (var side = -1; side <= 1; side += 2) {
      var ex = p.x + side * 12, sway = Math.sin(clock * 34 + side) * 3;
      var lg = ctx.createRadialGradient(ex, y + 4, 1, ex, y + length * 0.38, 17 * power);
      lg.addColorStop(0, 'rgba(255,255,225,0.98)');
      lg.addColorStop(0.2, 'rgba(255,221,105,0.92)');
      lg.addColorStop(0.52, 'rgba(255,95,20,0.55)');
      lg.addColorStop(1, 'rgba(255,45,0,0)');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.ellipse(ex + sway, y + length * 0.31, 7 * power, length * 0.43, sway * 0.025, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(255,248,198,' + (0.65 + 0.3 * Math.sin(clock * 55 + side)) + ')';
      ctx.beginPath(); ctx.moveTo(ex - 3, y); ctx.quadraticCurveTo(ex + sway, y + length * 0.24, ex + sway * 0.5, y + length * 0.52); ctx.quadraticCurveTo(ex - 5, y + length * 0.27, ex - 3, y); ctx.fill();
    }
    // A few tiny hot particles break off the plume for a less static, more physical look.
    for (var i = 0; i < 5; i++) {
      var phase = clock * (8 + i * 1.7) + i * 2.4;
      var px = p.x + Math.sin(phase) * (7 + i * 1.6);
      var py = y + 12 + ((clock * (55 + i * 9) + i * 17) % (length + 18));
      var r = (1.2 + (i % 3) * 0.65) * power;
      ctx.fillStyle = i % 2 ? 'rgba(255,178,48,0.8)' : 'rgba(255,242,177,0.9)';
      ctx.beginPath(); ctx.arc(px, py, r, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function drawPlayer() {
    var p = player, y = PLAYER_Y;
    if (p.wrecked) {
      drawCar(p.x, y, CAR_W, CAR_H, { body: '#1a1a1a', dark: '#0c0c0c', glass: '#050505', roof: '#141414', edge: '#ff6a00', lights: false, rot: 0.1 });

        ctx.beginPath(); ctx.arc(p.x + (f - 1) * 18, y - 10 - f * 4, fr, 0, 6.2832); ctx.fill();

    }
    if (p.inv > 0 && Math.floor(clock * 14) % 2 === 0) ctx.globalAlpha = 0.45;
    var tilt = clamp(p.vx / STEER_SPEED, -1, 1) * (p.driftT > 0 ? 0.25 : 0.14);

    // Drawn as a transparent embedded asset to preserve offline single-file play.
    ctx.save();

    } else {

    }
    ctx.restore();

    if (Input.held.up && state === 'playing') {
      ctx.fillStyle = 'rgba(255,180,60,' + (0.5 + 0.4 * Math.sin(clock * 40)) + ')';
      ctx.beginPath(); ctx.moveTo(p.x - 12, y + CAR_H / 2); ctx.lineTo(p.x, y + CAR_H / 2 + 22 + 8 * Math.sin(clock * 30)); ctx.lineTo(p.x + 12, y + CAR_H / 2); ctx.closePath(); ctx.fill();
    }
  }


  function drawSpeedLines() {
    if (!(state === 'playing' || state === 'title')) return;

  function drawParticles() {
    var i;
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      if (p.color.indexOf('#') === 0 && (p.color.indexOf('c') >= 0 || p.color.indexOf('d') >= 0 || p.color.indexOf('e') >= 0 || p.color.indexOf('b') >= 0 || p.color === '#7e1020' || p.color === '#4f101b')) {
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size * 0.72, p.size * 1.18, Math.atan2(p.vy, p.vx), 0, 6.2832); ctx.fill();
      } else {

      }

  function drawWorld() {
    ctx.save();
    if (shake > 0.3) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
    drawBackground();
    drawBloodDecals();
    drawDecor(true);
    var i;
    for (i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);
    for (i = 0; i < zombies.length; i++) drawZombie(zombies[i]);
    drawDetachedParts();
    if (state === 'title') { gap = 420; pursuer.x = ROAD_CX + Math.sin(clock * 0.7) * 120; }
    if (state !== 'gameover' || overKind === 'caught') drawPursuer();
    drawBullets();
    drawBoosterTrail();
    drawPlayer();
    drawDecor(false);
    drawSpeedLines();
    drawParticles();

      var g = ctx.createLinearGradient(0, H, 0, H - 220);
      g.addColorStop(0, 'rgba(255,30,30,' + a + ')'); g.addColorStop(1, 'rgba(255,30,30,0)');

      ctx.fillStyle = gl; ctx.fillRect(0, 0, 90, H);
      var gr = ctx.createLinearGradient(W, 0, W - 90, 0);
      gr.addColorStop(0, (flip ? 'rgba(255,170,40,' : 'rgba(255,40,40,') + (0.55 * a / 0.55 * 0.8) + ')'); gr.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = gr; ctx.fillRect(W - 90, 0, 90, H);

    card.addColorStop(0, 'rgba(20,24,35,0.96)'); card.addColorStop(1, 'rgba(10,10,17,0.96)');
    ctx.fillStyle = card; rrect(ctx, 290, 354, 700, 270, 18); ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,65,75,0.75)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ff3948'; rrect(ctx, 314, 374, 4, 34, 2); ctx.fill();
    txt('CONTROLS', 334, 400, 28, '#ffb02e', 'left', 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.beginPath(); ctx.moveTo(314, 416); ctx.lineTo(966, 416); ctx.stroke();
    var rows = [['↑', 'ACCELERATE'], ['↓', 'BRAKE'], ['←  →', 'STEER'], ['Z', 'START / RESTART'], ['SPACE', 'DEFENSIVE TIME PULSE']];
    for (var i = 0; i < rows.length; i++) {
      var y = 449 + i * 34;
      keycap(rows[i][0], 324, y, 130);
      txt(rows[i][1], 478, y - 2, 29, '#f4f5f8', 'left', 4);
    }
    ctx.restore();
    var on = Math.floor(clock * 2.2) % 2 === 0;
    ctx.save(); ctx.shadowColor = on ? 'rgba(255,65,75,0.85)' : 'rgba(255,176,46,0.55)'; ctx.shadowBlur = 20;
    txt('PRESS Z TO START', W / 2, 686, 55, on ? '#ffffff' : '#ffb02e', 'center', 8);
    ctx.restore();
    txt('ARROWS TO DRIVE   •   SPACE TO SLOW TIME', W / 2, 712, 20, '#9ca5b7', 'center', 3);
  }

  function drawGameOver() {
    // Fade the results screen in instead of replacing the action in a single frame.
    var fade = clamp(overT / 0.75, 0, 1);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
    var esc = overKind === 'escaped';
    txt(esc ? 'YOU ESCAPED!' : 'GAME OVER', W / 2, 190, esc ? 110 : 130, esc ? '#7fe05a' : '#e5262e', 'center', 12);
    txt(esc ? 'You reached the safe zone.' : 'THE PURSUER CAUGHT YOU', W / 2, 250, 38, '#d9d9de', 'center', 6);
    txt('SCORE  ' + fmtScore(score), W / 2, 345, 76, '#ffffff', 'center', 9);
    txt('TIME  ' + fmtTime(playTime), W / 2, 418, 54, '#ffd35a', 'center', 7);
    txt('BEST  ' + fmtScore(best), W / 2, 484, 54, '#ffffff', 'center', 7);
    if (newBest) txt('NEW BEST!', W / 2, 536, 42, Math.floor(clock * 4) % 2 === 0 ? '#ffd35a' : '#ff6a4a', 'center', 6);
    var ready = overT >= OVER_LOCK;
    var on = ready ? (Math.floor(clock * 2.2) % 2 === 0) : false;
    ctx.globalAlpha = (ready ? 1 : 0.4) * fade;
    txt('PRESS Z TO PLAY AGAIN', W / 2, 640, 66, on ? '#ffffff' : '#ffb02e', 'center', 9);
    ctx.restore();
  }

  function render() {
    drawWorld();
    if (state === 'title') { drawTitle(); return; }
    drawWarnings();
    if (state === 'playing' || state === 'dying') drawHUD();
    if (state === 'gameover') drawGameOver();
  }

  // ---------------------------------------------------------------- main loop
  newRun();
  prefillDecor();
  player.speed = idleDemoSpeed;

  var last = null;
  var autoRun = true; // only the headless test turns this off, to step the loop deterministically
  function frame(now) {
    if (last === null) last = now;
    var dt = clamp((now - last) / 1000, 0, 0.05);
    last = now;
    if (autoRun) { update(dt); render(); }
    window.requestAnimationFrame(frame);
  }
  if (window.focus) window.focus();
  window.requestAnimationFrame(frame);

  // Test hooks for the headless test script (tests/headless.js). The game itself never uses these.
  window.__rrdr = {
    step: function (dt) { update(dt); render(); },
    setAuto: function (v) { autoRun = !!v; },
    snap: function () {
      return { state: state, overKind: overKind, ts: ts, speed: player.speed, x: player.x, gap: gap, score: score, playTime: playTime,
               pulseCd: pulseCd, stun: pursuer.stun, zombies: zombies.length, obstacles: obstacles.length, particles: particles.length,
               floaters: floaters.length, rings: rings.length, streak: streak, kills: kills, overT: overT, inv: player.inv, best: best, decor: decor.length, warnLevel: warnLevel };
    },
    debug: {
      setGap: function (v) { gap = v; },
      setPlayTime: function (v) { playTime = v; },
      setSpeed: function (v) { player.speed = v; },
      clearEntities: function () { zombies.length = 0; obstacles.length = 0; },
      addZombieAtPlayer: function () { pushZombie(player.x, PLAYER_Y - 10, false); },
      addObstacleAtPlayer: function (kind) { pushObstacle(kind || 'wreck', player.x, PLAYER_Y - 20); },
      addObstacleAt: function (kind, x, y) { pushObstacle(kind, x, y); },
      addZombieAt: function (x, y) { pushZombie(x, y, false); },
      spawnRows: function (n) {
        var rows = [];
        for (var i = 0; i < n; i++) {
          zombies.length = 0; obstacles.length = 0;
          spawnRow();
          var lanes = {};
          obstacles.forEach(function (o) { lanes[Math.round((o.x - ROAD_L - LANE_W / 2) / LANE_W)] = true; });
          rows.push({ blocked: Object.keys(lanes).length, spacing: rowSpacing() });
        }
        zombies.length = 0; obstacles.length = 0;
        return rows;
      },
      constants: { MAX_SPEED: MAX_SPEED, PLAYER_Y: PLAYER_Y, MAX_CLOSE: MAX_CLOSE, WARN2: WARN2, ROAD_L: ROAD_L, ROAD_R: ROAD_R }
    }
  };
})();

</script>

<script>
/* Optional webcam face controls. Face frames are processed locally in this tab. */
(function () {
  'use strict';
  var startBtn = document.getElementById('gestureStart');
  var stopBtn = document.getElementById('gestureStop');
  var calBtn = document.getElementById('gestureCalibrate');
  var panel = document.getElementById('gesturePanel');
  var toggleBtn = document.getElementById('gestureToggle');
  var statusEl = document.getElementById('gestureStatus');
  var video = document.getElementById('gestureVideo');
  var stream = null, faceMesh = null, running = false, busy = false, raf = 0;
  var neutral = null, lastNose = null, blinkClosed = false, mouthOpen = false;
  var lastBlink = 0, lastMouth = 0, lastResult = 0;
  var thresholds = { x: 0.075, y: 0.065 };
  function status(t) { statusEl.textContent = t; }
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script'); sc.src = src; sc.crossOrigin = 'anonymous';
      sc.onload = resolve; sc.onerror = function () { reject(new Error('Could not load face-tracking library. Check your internet connection.')); };
      document.head.appendChild(sc);
    });
  }
  function setHeld(name, value) { if (window.Input) window.Input.inject(name, value); }
  function tap(name) {
    setHeld(name, true);
    window.setTimeout(function () { setHeld(name, false); }, 90);
  }
  function clearGestureKeys() { ['up','down','left','right'].forEach(function (k) { setHeld(k, false); }); }
  function dist(a,b) { var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
  function onResults(results) {
    lastResult = performance.now();
    var faces = results.multiFaceLandmarks;
    if (!faces || !faces.length) { clearGestureKeys(); status('Face not detected. Face the camera and keep your face visible.'); return; }
    var lm = faces[0];
    // Nose position is normalized to the camera image. Mirroring is handled for intuitive steering.
    var nose = { x: 1 - lm[1].x, y: lm[1].y };
    if (!neutral) { neutral = {x:nose.x,y:nose.y}; }
    var dx = nose.x-neutral.x, dy = nose.y-neutral.y;
    setHeld('left', dx < -thresholds.x);
    setHeld('right', dx > thresholds.x);
    setHeld('up', dy < -thresholds.y);
    setHeld('down', dy > thresholds.y);
    // Eye aspect ratio: a low vertical/horizontal ratio indicates a blink.
    var leftW = dist(lm[33],lm[133]) || 0.001;
    var leftH = dist(lm[159],lm[145]);
    var rightW = dist(lm[362],lm[263]) || 0.001;
    var rightH = dist(lm[386],lm[374]);
    var eyeRatio = ((leftH/leftW)+(rightH/rightW))/2;
    var closed = eyeRatio < 0.17;
    var now = performance.now();
    if (closed && !blinkClosed && now-lastBlink > 500) { tap('space'); lastBlink=now; }
    blinkClosed = closed;
    var mOpen = dist(lm[13],lm[14]) > 0.055;
    if (mOpen && !mouthOpen && now-lastMouth > 650) { tap('z'); lastMouth=now; }
    mouthOpen = mOpen;
    status('Face tracking active · Head controls ready · Camera frames stay on this device.');
  }
  async function frame() {
    if (!running || !faceMesh) return;
    if (video.readyState >= 2 && !busy) {
      busy = true;
      try { await faceMesh.send({image: video}); } catch (e) { status('Face tracking hiccup. Keep the camera visible and try again.'); }
      busy = false;
    }
    if (running) raf = requestAnimationFrame(frame);
  }
  async function start() {
    startBtn.disabled = true;
    try {
      status('Requesting camera permission…');
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
      panel.hidden = true;
      toggleBtn.hidden = false;
      video.srcObject = stream; await video.play();
      if (!window.FaceMesh) await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js');
      faceMesh = new window.FaceMesh({locateFile:function(file){return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/'+file;}});
      faceMesh.setOptions({maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.55, minTrackingConfidence:0.55});
      faceMesh.onResults(onResults);
      running = true; neutral = null; blinkClosed=false; mouthOpen=false;
      stopBtn.disabled = false; calBtn.disabled = false;
      status('Camera ready. Keep your head centred, then press Calibrate neutral.');
      raf = requestAnimationFrame(frame);
    } catch (e) {
      panel.hidden = false;
      toggleBtn.hidden = true;
      stop(); status('Could not start face controls: '+(e && e.message ? e.message : 'camera or tracking unavailable')+'. Use localhost/HTTPS and allow camera access.');
    } finally { startBtn.disabled = false; }
  }
  function stop() {
    running = false; if (raf) cancelAnimationFrame(raf); raf=0;
    if (stream) stream.getTracks().forEach(function(t){t.stop();}); stream=null;
    video.srcObject = null; faceMesh = null; busy=false; clearGestureKeys();
    setHeld('space',false); setHeld('z',false);
    stopBtn.disabled = true; calBtn.disabled = true;
  }
  startBtn.addEventListener('click', start);
  toggleBtn.addEventListener('click', function(){panel.hidden=false; toggleBtn.hidden=true;});
  stopBtn.addEventListener('click', function(){stop(); status('Camera stopped. Keyboard controls still work.');});
  calBtn.addEventListener('click', function(){ if(lastResult && performance.now()-lastResult<1200){neutral=null; status('Calibrating… hold your head in a neutral position.');} else status('No face detected yet. Face the camera first.'); });
  window.addEventListener('beforeunload', stop);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    startBtn.disabled=true; status('Camera access needs a supported browser and a secure context (HTTPS or localhost).');
  }
})();
</script>
